<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pines Report Cards{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark" style="background-color: #1e5631;">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Pines Report Cards</a>
        {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Students</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'subject_list' %}">Subjects</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'year_list' %}">School Years</a></li>
        </ul>
        <form method="post" action="{% url 'logout' %}" class="d-flex mb-0">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
        </form>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
