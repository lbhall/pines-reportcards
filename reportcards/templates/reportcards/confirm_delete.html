{% extends 'reportcards/base.html' %}
{% block title %}Confirm delete — Pines Report Cards{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h5">Delete "{{ object }}"?</h1>
                <p class="text-muted">This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url cancel_url %}" class="btn btn-link">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
